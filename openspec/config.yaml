schema: ps-spec

context: |
  Domain: storyforge, the hosted successor to cowriter (rafaxalv/cowriter): books move Concept > Chapters (plan of record)
  > Scenes (scene cards) > Drafts (per narrator voice) > Manuscript, in voices on a fixed 31-dimension framework, in
  several languages with shared paragraph ids. Private library = a book's research, characters + continuity, scenarios,
  lexicon; public library = admin-curated public-domain reference books, style studies, texture profiles. Claude features
  run as jobs producing proposals the author accepts. Keep cowriter vocabulary. Source of truth: PRD.md and ARCHITECTURE.md.
  Stack: TypeScript strict, Node 22, Next.js 15 App Router + React 19, TipTap 3, PostgreSQL 16 + Drizzle ORM,
  Better Auth (email magic link + Google, Drizzle adapter), Zod at every server boundary, pg-boss jobs, S3-compatible storage (image chosen in E03),
  @anthropic-ai/sdk with model claude-opus-5-5 (model/effort per feature via env).
  Deploy: one Docker image with two roles (ROLE=web|worker) plus `node dist/migrate.js`, managed Postgres; local = docker compose (Postgres) + npm run dev / npm run worker.
  Runtime shape (E00): custom Node server (src/server/main.ts) wraps Next.js; every entrypoint calls startProcess(role) (src/server/startup.ts);
  env = getEnv() (Zod, .env* loaded like Next); process-wide state via processSingleton (src/server/singleton.ts); Claude only via getClaude() (FakeClaude by default).
  Conventions: only src/server/<module> touches the DB or Claude; every domain function takes `actor` and enforces ownership;
  user text in prompts is delimited and treated as data, never instructions.
  Auth (E01): every domain function takes `actor` first (getActor / requirePageActor in pages); requireOwner / requireAdmin
  throw Forbidden, which clients see as 404 (never confirm another user's data exists); each entity gets the access test
  pattern from tests/integration/access.test.ts (twoUsers); every epic storing user data registers a purge step
  (registerPurgeStep). Dev servers build into .next-dev, production into .next.
  Books (E02): book data goes through src/server/books (ownedBook / withBook in core.ts: one ownership check per call,
  child rows always matched with book_id, book row locked for edits, timestamps from the DB clock via dbNow());
  rich text = ProseMirror JSON checked by parseRichText (src/shared/rich-text.ts, node set + nesting, extended
  deliberately per epic) and edited only with src/client/rich-text-editor.tsx (TipTap 3, no HTML strings);
  concurrent edits of one document use a version column (UPDATE ... WHERE version = expected -> Conflict);
  ordered lists use dense positions (moveWithin + writeOrder); server actions wrap domain calls in bookAction-style
  error mapping; styles use the tokens in src/app/globals.css (light + dark), no inline colours.
  Logging: pino via log(name) -> child logger, names storyforge:<module>[:<sub>]; requestId from AsyncLocalStorage on every line;
  jobs carry jobId + originating requestId; LOG_LEVEL env (debug locally); never log manuscript or library text.
  Tests: Vitest unit + integration (real Postgres), Playwright e2e; Claude replaced by FakeClaude replaying tests/fixtures/claude/.
  Commands: npm run lint, npm run typecheck, npm run test:unit (no Docker), npm test (unit + integration, needs Postgres),
  npm run build && npm run test:e2e. Feature docs: doc/<slug>.md, index doc/README.md.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# --- ps-spec (managed by ps-spec-init.sh; edit freely, the script won't overwrite an existing block) ---
rules:
  proposal:
    - "Name the epic (E0N) this change implements and copy its user stories; every change maps to exactly one EPICS.md epic"
  design:
    - "Include an Observability section (logger names, boundary log lines, correlation ids, DEBUG switch)"
    - "Include a Security section - if .claude/rules/security/ exists, name the rule files that apply to this change and how each is honoured (input validation, authn/authz, secrets, injection, data exposure); otherwise list the threats this change introduces and their mitigations, or `n/a` with a reason"
  tasks:
    - "End with three groups in this order - Observability, Tests, Docs - each task saying how it is verified"
    - "The Tests group verifies every item of the design.md Security section (an automated test or an interactive case each)"
    - "Tick each task `- [x]` the moment it lands, not at the end of the epic"
  test-plan:
    - "Every spec scenario maps to at least one automated test or interactive case"
    - "Every interactive case names its tool (playwright | chrome | http | console | manual)"
    - "Include observability checks - log lines that must be visible while the cases run"
operations:
  apply:
    guidance:
      - "Never code on main - work on the epic/<change-name> branch created in the code phase"
      - "Logging is part of the feature - implement the design.md Observability section alongside the code"
      - "Mark each task `- [x]` in tasks.md as it lands and commit per task group as `<type>(<change-name>): ...`"
      - "When all tasks are checked, run test-plan.md and record results before asking for human review"
  archive:
    guidance:
      - "Archive only after the human review gate - test-plan all pass, the feature doc is final, the docs index is updated, and the user said OK"
      - "After archiving, merge the epic branch into main with --no-ff, tag it, delete the branch, and set the epic to done in EPICS.md"
